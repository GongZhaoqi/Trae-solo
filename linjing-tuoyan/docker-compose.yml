version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: linjing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linjing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - linjing-network

  neo4j:
    image: neo4j:5
    container_name: linjing-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - linjing-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linjing-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/linjing
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      SECRET_KEY: your-production-secret-key-here
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j
    networks:
      - linjing-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linjing-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - linjing-network

volumes:
  postgres_data:
  neo4j_data:

networks:
  linjing-network:
    driver: bridge
